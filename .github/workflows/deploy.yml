name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Catch a page list or a marker that drifted before spending a build on it.
      - run: python3 tools/manifest.py --check
      - run: node tools/markers.js --check

      - run: npm run build
        env:
          # github.event.repository.name is the repo name, which is exactly the
          # path a project site is served from. A custom domain or a
          # username.github.io repo needs this set to / instead.
          ELEVENTY_PATH_PREFIX: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
