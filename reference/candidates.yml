# Candidate glossary terms, harvested from transcripts.
#
# No prompt reads this file. No renderer reads this file. It is a work queue.
#
# Fields
# ------
#   token             The string exactly as it appears on the page. Never normalized.
#   kind_guess        Triage only: uppercase | surname | part-prefix | phrase.
#   pages             Pages carrying the token.
#   ab_agree          Pages where pass A and pass B read the token identically.
#   misread_pages     Pages where raw output disagrees with VERIFIED text. Null until pages
#                     are verified. This is the number the solo bump trigger needs.
#   est_pages_fixed   (misread_pages / pages) * corpus_pages. Null while misread_pages is.
#   scans             scan_ids carrying it.
#   disposition       open | promoted | rejected
#   note              Evidence, ambiguity, or the glossary id it was promoted to.
#
# Provenance of this batch
# ------------------------
# Harvested from six RAW pages (005, 010, 015, 020, 025, 030) at glossary_version 0-2-0,
# using A/B agreement as a stand-in for verification. That stand-in is weaker than it looks:
# both passes ran the same model on the same prompt, so agreement filters random misreads
# and not correlated ones. Two passes can be confidently wrong together. Nothing here is
# promoted; every token still needs a human eye on the scan.
#
# The blind spot stands. This queue holds only tokens that reached a transcript. A term the
# model mangled past recognition is not here, and those are worth the most.

version: 0.3.0
harvested_through: "030"
harvest_basis: raw-ab-agreement   # NOT verified; see above
corpus_pages: 130

