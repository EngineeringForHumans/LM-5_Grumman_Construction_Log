  - id: cdr
    term: CDR
    kind: abbreviation
    expansion: null
    definition: >
      Open. In flight documents CDR is the Commander's crew station, the left-hand position
      in the cabin, which fits entries about panels, controls, and window hardware. In
      program paperwork it is more often Critical Design Review, which fits entries about
      drawings and signoffs. Check which sense your pages use before filling this in; the
      two readings send a reader in opposite directions.
    variants: []
    match: literal
    pattern: null
    examples: []
    source: null
    first_seen: null
    see_also: []

