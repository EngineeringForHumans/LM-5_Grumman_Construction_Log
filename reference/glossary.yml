  - id: ldw
    term: LDW
    kind: part-prefix
    expansion: null
    definition: >
      Open. A Grumman drawing- or part-number prefix used on LM hardware. The expansion is
      unconfirmed. The number format is not: a three-digit group, a five-digit group, then
      one or more dash-suffixed part identifiers. LSK numbers on the same page share the
      shape, so the prefix distinguishes series rather than format.
    variants: []
    match: pattern
    pattern: \bLDW ?\d{3}-\d{5}(?:-\d+)*\b
    examples:
      - LDW 410-11373-1     # scan 005
      - LDW 410-11372-9-2   # scan 005
    source: null
    first_seen: null
    see_also:
      - sn

  - id: lm
    term: LM
    kind: abbreviation
    expansion: Lunar Module
    definition: >
      The two-stage spacecraft that carried two crew members from lunar orbit to the surface
      and back. Grumman built it under NASA contract. Early program documents call it the
      LEM, for Lunar Excursion Module; NASA dropped "Excursion" in the mid-1960s. Do not add
      `L.M.` as a variant -- scan 025 carries "L.M.TUCKER", a technician's initials, and the
      linker would tag him as the spacecraft.
    variants: []
    match: literal
    pattern: null
    examples:
      - LM 5           # scan 015 header
      - LM-6           # scan 010
      - LM-3           # scan 005
    source: null
    first_seen: null
    see_also:
      - lm-5

  - id: lm-5
    term: LM-5
    kind: abbreviation
    expansion: null
    definition: >
      The specific flight article these logs document: the fifth production Lunar Module,
      flown on Apollo 11 and named Eagle. The logs also reference sibling articles -- LM-3,
      LM-4, LM-6 -- so LM-5 is not safe to assume from context alone.
    variants:
      - LM 5
      - LM5
    match: literal
    pattern: null
    examples:
      - "62000-EPS-LM5"   # scan 030
      - "LM5-14050"       # scan 030
    source: null
    first_seen: null
    see_also:
      - lm

