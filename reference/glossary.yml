  - id: cb
    term: CB
    kind: abbreviation
    expansion: Circuit Breaker
    definition: >
      A resettable panel breaker. The LM carried banks of them on the cabin sidewall panels,
      so wiring and power entries reference individual breakers by panel and position.
    variants: []
    match: literal
    pattern: null
    examples: []
    source: null
    first_seen: null
