# Glossary for the LM-5 construction log edition.
#
# This file has two consumers, and every field exists to serve one or both:
#
#   1. The transcription prompt. `term`, `variants`, and `examples` become the domain
#      vocabulary handed to the model. Nothing else in this file goes into the prompt --
#      definitions would give the model narrative context, which is what makes it invent.
#      Never list a variant you have not seen on a scan. Vocabulary you supply is
#      vocabulary the model can produce.
#   2. The site build. The renderer links occurrences in the displayed HTML and shows
#      `expansion` and `definition` on hover.
#
# The glossary never touches transcript bytes. Linking happens at render time, against a
# copy. A term in this file is a claim about what the writer meant, not a license to change
# what the writer wrote.
#
# How a term gets into this file
# ------------------------------
# Never from raw model output. This file is prompt input, so anything the model writes into
# it becomes vocabulary the model reads back on the next page, and a single misread surname
# turns into 120 pages of consistent-looking corroboration.
#
#   1. `tools/harvest.py` scans transcripts with `status: verified` and appends unrecognized
#      uppercase tokens, repeated capitalized surnames, and part-number-shaped strings to
#      `reference/candidates.yml`, with the scan_id that produced each one. A human has
#      already read those pages against the scan, so the string is known to exist.
#   2. You promote a candidate by hand, writing the definition yourself.
#   3. `version` below bumps, on either trigger below.
#
# Nothing reads `candidates.yml` except you.
#
# Bump triggers
# -------------
# A bump costs a re-run of every stale page, so the question is what a bump buys. Two rules,
# whichever fires first:
#
#   - **Batch.** Ten or more promoted terms are waiting. Cheap terms ride along free.
#   - **Solo.** One term's `est_pages_fixed` in `candidates.yml` reaches 15, about a tenth of
#     the corpus. A frequent surname the model currently garbles clears this alone; a
#     frequent term it already reads correctly never does, because vocabulary it does not
#     need changes nothing.
#
# `est_pages_fixed` is coverage times current error rate, both measured from the raw-versus-
# verified diff you already produce. Frequency alone is the wrong signal.
#
# Version bumps and re-runs
# -------------------------
# `version` here is recorded per transcript as `glossary_version` in the frontmatter. It is a
# separate axis from `prompt_version`, which covers the prompt template and the conventions
# it cites. Vocabulary changes often; transcription rules should not. Conflating them makes
# `prompt_version` churn until it stops meaning anything.
#
# A page whose `glossary_version` is behind this one is stale. On a bump:
#
#   1. Re-run every stale page, including verified ones. Verified pages are the point --
#      they are the only ground truth you have, and re-running them measures whether the
#      promoted terms helped.
#   2. Write output to `raw/{scan_id}.g{glossary_version}.md`. Never overwrite an earlier
#      raw file and never write over a verified transcript. Machine output does not clobber
#      human work, and keeping every run is what makes runs comparable.
#   3. Diff each new raw file against the verified text. Record the disagreement rate per
#      bump.
#   4. Review divergences in both directions. New vocabulary can hurt: a term the model
#      previously left as `[illegible]` is a term it can now confidently place on a page
#      that never carried it. A divergence is a question, not a correction.
#
# Stop bumping when the disagreement rate stops falling. Bump-and-re-run has no natural
# terminus otherwise.
#
# Linking policy
# --------------
#   - Matching is case-sensitive. `CM` matches, `cm` does not.
#   - Matching respects word boundaries.
#   - Longest match wins. `LM-5` on the page links to `lm-5`, never to `lm` plus a stray 5.
#   - The renderer links the first occurrence per page only. Otherwise `S/N` decorates every
#     third line of a parts log.
#
# Field reference
# ---------------
#   id          Slug, lowercase, unique. Stable forever -- annotations and URLs cite it.
#               People are `surname-initial` or `surname-firstname`, so the file sorts by
#               surname.
#   term        The canonical form, spelled as it most often appears on the page.
#   kind        abbreviation | part-prefix | person | component | phrase | symbol | procedure
#   expansion   What the letters stand for, or a person's full name. Null when unknown --
#               never guess here. An unsourced guess in this field is indistinguishable
#               from a fact once it reaches a tooltip.
#   definition  One or two sentences for a reader who is not an aerospace historian. When
#               `expansion` is null, state the candidate readings and why they are open.
#   variants    Other spellings seen on pages. Matched literally, same as `term`.
#   match       literal | none
#               `none` means prompt vocabulary only; the renderer skips it. Use it when the
#               term collides with ordinary text, not because the term is short.
#   pattern     ECMAScript regex for `kind: part-prefix`, where the term is a shape rather
#               than a fixed string. Null otherwise.
#   examples    Real strings as they appear on scans. Grounds the pattern and feeds the
#               prompt. Cite the scan_id in a trailing comment when you add one.
#   source      Citation for the expansion -- document, page, or archive reference. A term
#               with a citation is settled. A term with `source: null` is an open question,
#               and that is the only difference between the two. CI fails a release build on
#               any null source; it does not fail a commit, so you can add terms faster than
#               you can source them.
#   first_seen  scan_id of the earliest page carrying the term. Optional.
#   see_also    List of ids.
#
# Conventions: Unicode NFC, LF endings, two-space indent, keys in the order above,
# entries sorted by `id`.

